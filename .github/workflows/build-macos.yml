name: macOS

on:
  pull_request:
  push:
    branches:
      - dev
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: build-macos
    strategy:
      fail-fast: false
      matrix:
        # macos-14: arm64 (oldest supported version as of 18-11-2025)
        # macos-15-intel: amd64 (last intel version to be supported by github runners)
        # See https://github.com/actions/runner-images/issues/13046
        os: [macos-14, macos-15-intel]
        include:
          - os: macos-14
            goarch: arm64
            smoketest: smoketest-quick
          - os: macos-15-intel
            goarch: amd64
            smoketest: smoketest-host
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install qemu binaryen
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Extract TinyGo version
        id: version
        run: ./.github/workflows/tinygo-extract-version.sh | tee -a "$GITHUB_OUTPUT"
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - uses: ./.github/actions/setup-llvm-macos
        with:
          os: ${{ matrix.os }}
      - name: make gen-device
        id: gen-device
        run: make -j3 gen-device
      - name: Build TinyGo release tarball
        id: release
        run: make release -j3
      - name: Make release artifact
        id: artifact
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: cp -p build/release.tar.gz build/tinygo${{ steps.version.outputs.version }}.darwin-${{ matrix.goarch }}.tar.gz
      - name: Publish release artifact
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: darwin-${{ matrix.goarch }}-double-zipped-${{ steps.version.outputs.version }}
          path: build/tinygo${{ steps.version.outputs.version }}.darwin-${{ matrix.goarch }}.tar.gz
          archive: false
      - name: Test TinyGo
        if: ${{ !cancelled() && steps.gen-device.outcome == 'success' }}
        run: make test GOTESTFLAGS="-only-current-os"
      - name: Unpack TinyGo build
        id: unpack
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: |
          mkdir -p build/release-test
          tar -xzf build/release.tar.gz -C build/release-test
      - name: Test stdlib packages
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: make tinygo-test TINYGO=$(PWD)/build/release-test/tinygo/bin/tinygo
      - name: Smoke tests
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: make ${{ matrix.smoketest }} TINYGO=$(PWD)/build/release-test/tinygo/bin/tinygo

  test-macos-homebrew:
    name: homebrew-install
    runs-on: macos-latest
    strategy:
      matrix:
        version: [16, 17, 18, 19, 20]
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Fix Python symlinks
        run: |
          # Github runners have broken symlinks, so relink
          # see: https://github.com/actions/setup-python/issues/577
          brew list -1 | grep python | while read formula; do brew unlink $formula; brew link --overwrite $formula; done
      - name: Install LLVM
        run: |
          brew install llvm@${{ matrix.version }}
          brew link llvm@${{ matrix.version }}
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Build TinyGo (LLVM ${{ matrix.version }})
        run: go install -tags=llvm${{ matrix.version }}
      - name: Check binary
        run: tinygo version
      - name: Build TinyGo (default LLVM)
        if: matrix.version == 20
        run: go install
      - name: Check binary
        if: matrix.version == 20
        run: tinygo version
